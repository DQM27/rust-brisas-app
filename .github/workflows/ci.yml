name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # ==========================================================================
  # QUALITY GATE - Runs on all pushes and PRs
  # ==========================================================================
  quality-gate:
    name: 🛡️ Quality Checks
    runs-on: windows-latest
    timeout-minutes: 30
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/') || !startsWith(github.event.head_commit.message, 'chore(release):')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri'

      - name: Install Dependencies
        run: npm ci

      - name: Frontend Lint & Check
        run: npm run check

      - name: Rust Format Check
        run: cd src-tauri && cargo fmt --check

      - name: Clippy (Strict)
        run: |
          cd src-tauri
          cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests
        run: cd src-tauri && cargo test --all-features

  # ==========================================================================
  # BUILD - Creates artifacts on push to main/develop (no release)
  # ==========================================================================
  build:
    name: 🔨 Build Windows
    needs: quality-gate
    runs-on: windows-latest
    timeout-minutes: 45
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri'

      - name: Install Dependencies
        run: npm ci

      - name: Build Tauri App
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --target x86_64-pc-windows-msvc

      - name: Upload MSI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mega-Brisas-Windows-MSI
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Upload NSIS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mega-Brisas-Windows-NSIS
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error

  # ==========================================================================
  # RELEASE - Only when pushing a tag like v1.0.0
  # ==========================================================================
  release:
    name: 📦 Release
    needs: quality-gate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri'

      - name: Install Dependencies
        run: npm ci

      - name: Validate Signing Secrets
        shell: bash
        run: |
          if [ -z "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" ]; then
            echo "❌ Error: TAURI_SIGNING_PRIVATE_KEY is missing"
            exit 1
          fi
          if [ -z "${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}" ]; then
            echo "❌ Error: TAURI_SIGNING_PRIVATE_KEY_PASSWORD is missing"
            exit 1
          fi
          echo "✅ All signing secrets are present"

      - name: Build and Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Mega Brisas ${{ github.ref_name }}'
          releaseBody: 'Descarga el instalador para Windows (.msi o .exe)'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --target x86_64-pc-windows-msvc